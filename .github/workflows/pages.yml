# Publica el sitio en GitHub Pages con cada cambio en main.
# No hay compilación: el sitio es HTML, CSS y JavaScript planos, así que se
# sube el repositorio tal cual.
name: Publicar el sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue por vez; si entra uno nuevo mientras hay otro en curso, espera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true enciende Pages la primera vez, sin tocar los ajustes a mano.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
